<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><!--bro i didn't change the title cuz idk if u wanna change or not-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1;
            background-color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header > div {
            display: block;
        }

        header h2 {
            font-family: 'Space Grotesk', sans-serif;
            color: #2563EB;
            margin: 0;
        }

        nav a {
            text-decoration: none;
            color: #475569;
            margin-left: 20px;
        }

        .github-link {
            display: block;
            margin-top: 8px;
            color: #2563EB;
            font-size: 13px;
            text-decoration: none;
        }

        .github-link:hover {
            text-decoration: underline;
        }

        .container {
            display: flex;
            flex-direction: row;
            align-items: center;
            min-height: 100vh;
            padding-left: 24px;
        }

        .upload {
            background-color: #3b3b3b;
            width: 400px;
            height: 400px;
            border-radius: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        
        .button {
            display: inline-block;
            background-color: #2563EB;
            color: white;
            text-decoration: none;
            padding: 15px 28px;
            border-radius: 8px;
            font-weight: 600;
        }

        .button:hover {
            background-color: #1D4ED8;
        }


        
    </style>
</head>
<body>

    <header>
        <div>
            <h2>ResumeAnalyzer</h2>

            <!-- this link opens the GitHub repository -->
            <a class="github-link"
               href="https://github.com/rishabhraj6232-a11y/Resume-Analyzer"
               target="_blank"
               rel="noopener noreferrer">
                bro window here is Link to our GitHub page
            </a>
        </div>

        <!-- these links move to sections on this page -->
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            
        </nav>
    </header>

   <div class="container">
        <form method="POST" enctype="multipart/form-data" class="upload">

            <input type="file" name="resume">

            <button>Upload Resume</button>

        </form>
    </div> 
</body>
</html>
