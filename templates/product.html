<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
        }

        div {
            display: flex;
            flex-direction: row;
            align-items: center;
            min-height: 100vh;
            padding-left: 24px;
        }

        .upload {
            background-color: #3b3b3b;
            width: 400px;
            height: 400px;
            border-radius: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

    </style>
</head>
<body>

   <div class="container">
        <form method="POST" enctype="multipart/form-data" class="upload">

            <input type="file" name="resume">

            <button>Upload Resume</button>

        </form>
    </div> 
</body>
</html>
